<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentification</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-yellow-300 via-green-400 to-green-500 flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-gradient-to-br from-yellow-200 to-green-300 rounded-3xl shadow-2xl p-8">

        <!-- Icon -->
        <div class="flex justify-center mb-6">
            <div class="w-20 h-20 bg-blue-400 rounded-full flex items-center justify-center shadow-lg">
                <svg class="w-12 h-12 text-blue-900" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                </svg>
            </div>
        </div>

        <!-- Title -->
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-8">
            Authentification
        </h2>

        <!-- Form -->
        <form class="space-y-6">

            <!-- Email / Téléphone Field -->
            <div>
                <label for="email" class="block text-sm font-semibold text-gray-800 mb-2">
                    Email / Téléphone
                </label>
                <input
                    type="text"
                    id="email"
                    name="email"
                    class="w-full px-4 py-3 bg-white bg-opacity-70 border-2 border-transparent rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200 placeholder-gray-500"
                    placeholder="Entrez votre email ou téléphone"
                    required
                >
            </div>

            <!-- Password Field -->
            <div>
                <label for="password" class="block text-sm font-semibold text-gray-800 mb-2">
                    Mot de passe
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="w-full px-4 py-3 bg-white bg-opacity-70 border-2 border-transparent rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200 placeholder-gray-500"
                    placeholder="Entrez votre mot de passe"
                    required
                >
            </div>

            <!-- Submit Button -->
            <div class="pt-4">
                <button
                    type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg shadow-lg hover:shadow-xl transform hover:scale-105 transition duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
                >
                    Se connecter
                </button>
            </div>

        </form>

        <!-- Optional: Additional Links -->
        <div class="mt-6 text-center space-y-2">
            <a href="#" class="text-sm text-gray-700 hover:text-gray-900 hover:underline">
                Mot de passe oublié ?
            </a>
        </div>

    </div>

</body>
</html>
