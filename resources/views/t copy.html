<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Dashboard - Plateforme</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <style>
            /* Custom scrollbar */
            ::-webkit-scrollbar {
                width: 6px;
            }
            ::-webkit-scrollbar-track {
                background: #f1f1f1;
            }
            ::-webkit-scrollbar-thumb {
                background: #888;
                border-radius: 3px;
            }
        </style>
    </head>
    <body class="bg-gray-50 font-sans">
        <div class="flex h-screen overflow-hidden relative">
            <!-- Mobile Menu Overlay -->
            <div
                id="mobileMenuOverlay"
                class="hidden fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden"
                onclick="toggleMobileMenu()"
            ></div>

            <!-- Sidebar -->
            <aside
                id="sidebar"
                class="w-64 bg-green-500 text-black flex-shrink-0 overflow-y-auto fixed lg:relative h-full z-50 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out"
            >
                <!-- Logo/Header -->
                <div
                    class="p-3 lg:p-4 bg-black flex items-center justify-between"
                >
                    <div class="flex items-center space-x-2 lg:space-x-3">
                        <div
                            class="w-7 h-7 lg:w-8 lg:h-8 bg-white rounded-full flex items-center justify-center flex-shrink-0"
                        >
                            <svg
                                class="w-5 h-5 lg:w-6 lg:h-6 text-black"
                                viewBox="0 0 24 24"
                                fill="currentColor"
                            >
                                <path
                                    d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z"
                                />
                            </svg>
                        </div>
                        <span
                            class="text-white font-semibold text-xs lg:text-sm"
                            >Plateforme name</span
                        >
                    </div>
                    <!-- Close button for mobile -->
                    <button
                        onclick="toggleMobileMenu()"
                        class="lg:hidden text-white hover:bg-gray-800 p-2 rounded"
                    >
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <!-- Navigation Menu -->
                <nav class="py-4">
                    <!-- Menu Header -->
                    <div class="px-4 mb-2 flex items-center space-x-2">
                        <i class="fas fa-bars text-sm"></i>
                        <span class="font-bold text-sm tracking-wider"
                            >NAVIGATION</span
                        >
                    </div>

                    <!-- Tableau de bord -->
                    <a
                        href="#"
                        class="flex items-center space-x-3 px-4 py-3 bg-green-600 hover:bg-green-600 transition-colors"
                    >
                        <i class="fas fa-th text-sm"></i>
                        <span class="font-medium text-sm">Tableau de bord</span>
                    </a>

                    <!-- Administration Section -->
                    <div class="mt-6">
                        <div class="px-4 mb-2">
                            <span class="font-bold text-sm tracking-wider"
                                >ADMINISTRATION</span
                            >
                        </div>

                        <a
                            href="#"
                            class="flex items-center space-x-3 px-4 py-3 hover:bg-green-600 transition-colors"
                        >
                            <i class="fas fa-bullhorn text-sm"></i>
                            <span class="font-medium text-sm"
                                >Types d'appel d'offre</span
                            >
                        </a>

                        <a
                            href="#"
                            class="flex items-center space-x-3 px-4 py-3 hover:bg-green-600 transition-colors"
                        >
                            <i class="fas fa-file-alt text-sm"></i>
                            <span class="font-medium text-sm"
                                >Appels d'offre</span
                            >
                        </a>

                        <a
                            href="#"
                            class="flex items-center space-x-3 px-4 py-3 hover:bg-green-600 transition-colors"
                        >
                            <i class="fas fa-user-tie text-sm"></i>
                            <span class="font-medium text-sm"
                                >Prestataires</span
                            >
                        </a>
                    </div>

                    <!-- Administration Section 2 -->
                    <div class="mt-6">
                        <div class="px-4 mb-2">
                            <span class="font-bold text-sm tracking-wider"
                                >ADMINISTRATION</span
                            >
                        </div>

                        <a
                            href="#"
                            class="flex items-center space-x-3 px-4 py-3 hover:bg-green-600 transition-colors"
                        >
                            <i class="fas fa-user-tag text-sm"></i>
                            <span class="font-medium text-sm">Roles</span>
                        </a>

                        <a
                            href="#"
                            class="flex items-center space-x-3 px-4 py-3 hover:bg-green-600 transition-colors"
                        >
                            <i class="fas fa-shield-alt text-sm"></i>
                            <span class="font-medium text-sm">Permissions</span>
                        </a>

                        <a
                            href="#"
                            class="flex items-center space-x-3 px-4 py-3 hover:bg-green-600 transition-colors"
                        >
                            <i class="fas fa-users text-sm"></i>
                            <span class="font-medium text-sm">Personnels</span>
                        </a>
                    </div>
                </nav>
            </aside>

            <!-- Main Content -->
            <div class="flex-1 flex flex-col overflow-hidden w-full">
                <!-- Top Navigation Bar -->
                <header class="bg-white shadow-sm border-b border-gray-200">
                    <div
                        class="flex items-center justify-between px-3 lg:px-6 py-3"
                    >
                        <!-- Mobile Menu Button -->
                        <button
                            onclick="toggleMobileMenu()"
                            class="lg:hidden p-2 hover:bg-gray-100 rounded-lg mr-2"
                            aria-label="Ouvrir le menu"
                        >
                            <i class="fas fa-bars text-xl text-gray-600"></i>
                        </button>

                        <!-- Search Bar -->
                        <div class="flex-1 max-w-2xl">
                            <div class="relative">
                                <input
                                    type="text"
                                    placeholder="Rechercher..."
                                    class="w-full pl-3 lg:pl-4 pr-10 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent"
                                />
                                <button
                                    class="absolute right-3 top-1/2 transform -translate-y-1/2"
                                >
                                    <i
                                        class="fas fa-search text-gray-400 text-sm"
                                    ></i>
                                </button>
                            </div>
                        </div>

                        <!-- User Profile -->
                        <div
                            class="flex items-center space-x-2 lg:space-x-3 ml-2 lg:ml-6"
                        >
                            <button
                                class="text-gray-500 hover:text-gray-700 p-2"
                            >
                                <i class="far fa-bell text-lg lg:text-xl"></i>
                            </button>
                            <div
                                class="hidden sm:flex items-center space-x-2 cursor-pointer"
                            >
                                <div
                                    class="w-8 h-8 lg:w-10 lg:h-10 bg-blue-500 rounded-full flex items-center justify-center flex-shrink-0"
                                >
                                    <i
                                        class="fas fa-user text-white text-sm"
                                    ></i>
                                </div>
                                <span
                                    class="hidden md:block font-medium text-gray-700 text-sm"
                                    >Yao Kan Alian</span
                                >
                                <i
                                    class="fas fa-chevron-down text-gray-500 text-xs"
                                ></i>
                            </div>
                            <!-- Mobile User Icon -->
                            <div
                                class="sm:hidden w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center cursor-pointer"
                            >
                                <i class="fas fa-user text-white text-sm"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Filters Bar -->
                    <div
                        class="px-3 lg:px-6 py-3 bg-gray-50 border-t border-gray-200"
                    >
                        <!-- Mobile: Toggle button -->
                        <button
                            onclick="toggleFilters()"
                            class="md:hidden w-full flex items-center justify-between px-3 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors"
                        >
                            <span class="text-sm font-medium text-gray-700">
                                <i class="fas fa-filter mr-2"></i>Filtres
                            </span>
                            <i
                                id="filterToggleIcon"
                                class="fas fa-chevron-down text-gray-500 text-xs transition-transform"
                            ></i>
                        </button>

                        <!-- Filters Container -->
                        <div
                            id="filtersContainer"
                            class="hidden md:block mt-3 md:mt-0"
                        >
                            <div
                                class="grid grid-cols-1 md:grid-cols-2 lg:flex lg:items-center gap-3 lg:gap-4"
                            >
                                <!-- Période -->
                                <div
                                    class="flex flex-col md:flex-row md:items-center space-y-1 md:space-y-0 md:space-x-2"
                                >
                                    <label
                                        class="text-xs lg:text-sm font-medium text-gray-700 whitespace-nowrap"
                                        >Période</label
                                    >
                                    <div class="flex items-center space-x-2">
                                        <div
                                            class="flex items-center space-x-1 flex-1"
                                        >
                                            <input
                                                type="date"
                                                value="2024-10-15"
                                                class="w-full md:w-auto px-2 lg:px-3 py-1.5 border border-gray-300 rounded text-xs lg:text-sm focus:outline-none focus:ring-2 focus:ring-orange-400"
                                            />
                                        </div>
                                        <span class="text-gray-500">-</span>
                                        <div
                                            class="flex items-center space-x-1 flex-1"
                                        >
                                            <input
                                                type="date"
                                                value="2025-11-16"
                                                class="w-full md:w-auto px-2 lg:px-3 py-1.5 border border-gray-300 rounded text-xs lg:text-sm focus:outline-none focus:ring-2 focus:ring-orange-400"
                                            />
                                        </div>
                                    </div>
                                </div>

                                <!-- Appel offre -->
                                <div
                                    class="flex flex-col md:flex-row md:items-center space-y-1 md:space-y-0 md:space-x-2"
                                >
                                    <label
                                        class="text-xs lg:text-sm font-medium text-gray-700 whitespace-nowrap"
                                        >Appel offre</label
                                    >
                                    <select
                                        class="w-full md:w-auto px-2 lg:px-3 py-1.5 border border-gray-300 rounded text-xs lg:text-sm bg-white focus:outline-none focus:ring-2 focus:ring-orange-400"
                                    >
                                        <option>Choisissez</option>
                                        <option>Appel offre 1</option>
                                        <option>Appel offre 2</option>
                                    </select>
                                </div>

                                <!-- Etat appel offre -->
                                <div
                                    class="flex flex-col md:flex-row md:items-center space-y-1 md:space-y-0 md:space-x-2"
                                >
                                    <label
                                        class="text-xs lg:text-sm font-medium text-gray-700 whitespace-nowrap"
                                        >Etat appel offre</label
                                    >
                                    <select
                                        class="w-full md:w-auto px-2 lg:px-3 py-1.5 border border-gray-300 rounded text-xs lg:text-sm bg-white focus:outline-none focus:ring-2 focus:ring-orange-400"
                                    >
                                        <option>Choisissez</option>
                                        <option>En cours</option>
                                        <option>Terminé</option>
                                        <option>Annulé</option>
                                    </select>
                                </div>

                                <!-- Search Button -->
                                <button
                                    class="w-full md:w-auto px-4 py-2 bg-orange-500 hover:bg-orange-600 text-white rounded transition-colors flex items-center justify-center space-x-2 lg:mt-0"
                                >
                                    <i class="fas fa-search text-sm"></i>
                                    <span class="text-xs lg:text-sm font-medium"
                                        >Rechercher</span
                                    >
                                </button>
                            </div>
                        </div>
                    </div>
                </header>

                <!-- Main Content Area -->
                <main class="flex-1 overflow-y-auto bg-white p-3 lg:p-6">
                    <!-- Content goes here -->
                    <div
                        class="h-full flex items-center justify-center text-gray-400"
                    >
                        <p class="text-sm lg:text-lg text-center px-4">
                            Contenu du tableau de bord
                        </p>
                    </div>
                </main>
            </div>
        </div>

        <script>
            function toggleMobileMenu() {
                const sidebar = document.getElementById("sidebar");
                const overlay = document.getElementById("mobileMenuOverlay");

                sidebar.classList.toggle("-translate-x-full");
                overlay.classList.toggle("hidden");

                // Prevent body scroll when menu is open
                if (!sidebar.classList.contains("-translate-x-full")) {
                    document.body.style.overflow = "hidden";
                } else {
                    document.body.style.overflow = "";
                }
            }

            function toggleFilters() {
                const filtersContainer =
                    document.getElementById("filtersContainer");
                const toggleIcon = document.getElementById("filterToggleIcon");

                filtersContainer.classList.toggle("hidden");
                toggleIcon.classList.toggle("rotate-180");
            }

            // Close menu when window is resized to desktop
            window.addEventListener("resize", function () {
                if (window.innerWidth >= 1024) {
                    const sidebar = document.getElementById("sidebar");
                    const overlay =
                        document.getElementById("mobileMenuOverlay");
                    sidebar.classList.remove("-translate-x-full");
                    overlay.classList.add("hidden");
                    document.body.style.overflow = "";
                }

                // Show filters on desktop, respect toggle on mobile
                if (window.innerWidth >= 768) {
                    const filtersContainer =
                        document.getElementById("filtersContainer");
                    filtersContainer.classList.remove("hidden");
                }
            });
        </script>
    </body>
</html>
